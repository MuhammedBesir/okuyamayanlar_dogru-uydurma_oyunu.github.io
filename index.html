<!DOCTYPE html>
<html lang="tr">
<head>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap');

<body>
  <div class="container" id="menu">

    <div id="sectionButtons"></div>
  </div>

  <div class="container" id="game" style="display:none;">
    <h1 id="sectionTitle"></h1>
    <div class="question" id="question">Yükleniyor...</div>

      <button class="true-btn" onclick="answer(true)">Doğru</button>
      <button class="false-btn" onclick="answer(false)">Uydurma</button>
    </div>
    <button id="nextBtn" onclick="nextQuestion()">Sonraki</button>
    <div class="result" id="result"></div>
    <div class="final-score" id="final-score"></div>
    <div class="feedback" id="feedback"></div>
  </div>


 <script src="script.js"></script>
